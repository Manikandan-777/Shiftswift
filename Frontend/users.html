<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShiftSwift - User Profiles</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-brand text-white">
        <i class="bi bi-lightning-charge-fill fs-4 text-primary me-2"></i>
        <span class="fs-5 fw-bold tracking-wide">ShiftSwift</span>
      </div>
      
      <div class="sidebar-menu">
        <a href="dashboard.html" class="sidebar-link">
          <i class="bi bi-grid-1x2-fill"></i>
          <span>Dashboard</span>
        </a>
        <a href="departments.html" class="sidebar-link">
          <i class="bi bi-building"></i>
          <span>Departments</span>
        </a>
        <a href="shifts.html" class="sidebar-link">
          <i class="bi bi-calendar3"></i>
          <span>Shifts</span>
        </a>
        <a href="attendance.html" class="sidebar-link">
          <i class="bi bi-clock-history"></i>
          <span>Attendance</span>
        </a>
        <a href="leaves.html" class="sidebar-link">
          <i class="bi bi-calendar2-x"></i>
          <span>Leave Requests</span>
        </a>
        <!-- Admin only -->
        <a href="users.html" class="sidebar-link active admin-only">
          <i class="bi bi-people-fill"></i>
          <span>User Profiles</span>
        </a>
      </div>

      <div class="sidebar-footer">
        <button id="btn-logout" class="btn btn-outline-danger w-100 d-flex align-items-center justify-content-center gap-2 py-2">
          <i class="bi bi-box-arrow-left"></i>
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Header Navbar -->
      <header class="top-navbar px-4">
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-light d-lg-none" type="button" onclick="document.querySelector('.sidebar').classList.toggle('show')">
            <i class="bi bi-list fs-4"></i>
          </button>
          <h4 class="m-0 fw-bold d-none d-sm-block">User Accounts</h4>
        </div>
        <div class="d-flex align-items-center gap-3">
          <div class="text-end">
            <h6 class="mb-0 fw-semibold" id="nav-username">User</h6>
            <span class="badge bg-primary-subtle text-primary border border-primary-subtle" id="nav-role" style="font-size: 0.75rem;">Role</span>
          </div>
        </div>
      </header>

      <!-- Content Body -->
      <div class="content-body fade-in">
        <!-- Controls Bar -->
        <div class="d-flex flex-column flex-md-row gap-3 align-items-md-center justify-content-between mb-4">
          <div class="input-group" style="max-width: 360px;">
            <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
            <input type="text" class="form-control border-start-0 ps-0" id="user-search" placeholder="Search by name or email...">
          </div>
        </div>

        <!-- Data Card -->
        <div class="data-card">
          <div class="table-responsive">
            <table class="table mb-0 align-middle">
              <thead>
                <tr>
                  <th style="width: 80px;">S.No</th>
                  <th>Username</th>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Department</th>
                </tr>
              </thead>
              <tbody id="user-table-body">
                <tr>
                  <td colspan="5" class="text-center py-5 text-muted">
                    <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                    Loading users...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          
          <!-- Card Footer for pagination -->
          <div class="data-card-header border-top border-bottom-0 py-3">
            <span class="small text-muted" id="user-count">Showing 0 of 0 records</span>
            <div id="user-pagination"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      UsersPage.init();
    });
  </script>
</body>
</html>
