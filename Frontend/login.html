<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShiftSwift - Portal Sign In</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-wrapper">

  <div class="auth-card p-4 p-md-5">
    <!-- Header -->
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center bg-primary text-white rounded-3 mb-2" style="width: 50px; height: 50px;">
        <i class="bi bi-lightning-charge-fill fs-3"></i>
      </div>
      <h3 class="fw-bold text-dark m-0">ShiftSwift</h3>
      <p class="text-muted small">Employee Scheduling & Management</p>
    </div>

    <!-- Toggle Tabs -->
    <ul class="nav nav-pills nav-fill bg-light p-1 rounded-3 mb-4" id="auth-tabs" role="tablist">
      <li class="nav-item">
        <button class="nav-link active rounded-3" id="tab-login" data-bs-toggle="pill" data-bs-target="#panel-login" type="button">Sign In</button>
      </li>
      <li class="nav-item">
        <button class="nav-link rounded-3" id="tab-register" data-bs-toggle="pill" data-bs-target="#panel-register" type="button">Register</button>
      </li>
    </ul>

    <!-- Tabs Content -->
    <div class="tab-content" id="auth-tabs-content">
      <!-- Login Panel -->
      <div class="tab-pane fade show active" id="panel-login" role="tabpanel">
        <form id="form-login" novalidate>
          <div class="mb-3">
            <label for="login-username" class="form-label small fw-semibold">Username</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
              <input type="text" class="form-control border-start-0 ps-0" id="login-username" placeholder="Enter username" required>
              <div class="invalid-feedback">Please enter your username.</div>
            </div>
          </div>
          <div class="mb-4">
            <label for="login-password" class="form-label small fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
              <input type="password" class="form-control border-start-0 ps-0" id="login-password" placeholder="Enter password" required>
              <div class="invalid-feedback">Please enter your password.</div>
            </div>
          </div>
          <button type="submit" class="btn premium-btn w-100 py-2.5">
            Sign In <i class="bi bi-arrow-right-short ms-1"></i>
          </button>
        </form>
      </div>

      <!-- Register Panel -->
      <div class="tab-pane fade" id="panel-register" role="tabpanel">
        <form id="form-register" novalidate>
          <div class="mb-3">
            <label for="reg-username" class="form-label small fw-semibold">Username</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
              <input type="text" class="form-control border-start-0 ps-0" id="reg-username" placeholder="Choose username" required>
              <div class="invalid-feedback">Choose a unique username.</div>
            </div>
          </div>
          <div class="mb-3">
            <label for="reg-email" class="form-label small fw-semibold">Email Address</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
              <input type="email" class="form-control border-start-0 ps-0" id="reg-email" placeholder="name@example.com" required>
              <div class="invalid-feedback">Enter a valid email address.</div>
            </div>
          </div>
          <div class="mb-3">
            <label for="reg-password" class="form-label small fw-semibold">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
              <input type="password" class="form-control border-start-0 ps-0" id="reg-password" placeholder="Min. 6 characters" required minlength="6">
              <div class="invalid-feedback">Password must be at least 6 characters.</div>
            </div>
          </div>
          <div class="mb-4">
            <label for="reg-role" class="form-label small fw-semibold">Designated Role</label>
            <select class="form-select" id="reg-role" required>
              <option value="" disabled selected>Select Role</option>
              <option value="ROLE_EMPLOYEE">Employee</option>
              <option value="ROLE_ADMIN">Administrator</option>
            </select>
            <div class="invalid-feedback">Please select a role.</div>
          </div>
          <button type="submit" class="btn premium-btn w-100 py-2.5 bg-success border-success">
            Register Account <i class="bi bi-plus-circle ms-1"></i>
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  
  <script>
    // Handles login and registration forms
    document.addEventListener("DOMContentLoaded", () => {
      // Clear old session
      localStorage.clear();

      // Login form handler
      document.getElementById("form-login").addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!Utils.validateForm("form-login")) return;

        const username = document.getElementById("login-username").value.trim();
        const password = document.getElementById("login-password").value;

        Utils.showLoading(true);
        try {
          const res = await API.login({ username, password });
          Auth.saveSession(res);
          Utils.showToast("Signed in successfully!", "success");
          setTimeout(() => {
            window.location.href = "dashboard.html";
          }, 1000);
        } catch (err) {
          Utils.showToast(err.message, "danger");
        } finally {
          Utils.showLoading(false);
        }
      });

      // Register form handler
      document.getElementById("form-register").addEventListener("submit", async (e) => {
        e.preventDefault();
        if (!Utils.validateForm("form-register")) return;

        const username = document.getElementById("reg-username").value.trim();
        const email = document.getElementById("reg-email").value.trim();
        const password = document.getElementById("reg-password").value;
        const role = document.getElementById("reg-role").value;

        Utils.showLoading(true);
        try {
          const res = await API.register({ username, email, password, role });
          Utils.showToast(res.message || "Registration successful! You can now log in.", "success");
          
          // Switch to login tab
          document.getElementById("tab-login").click();
          Utils.resetForm("form-register");
        } catch (err) {
          Utils.showToast(err.message, "danger");
        } finally {
          Utils.showLoading(false);
        }
      });
    });
  </script>
</body>
</html>
