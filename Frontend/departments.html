<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShiftSwift - Departments</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-brand text-white">
        <i class="bi bi-lightning-charge-fill fs-4 text-primary me-2"></i>
        <span class="fs-5 fw-bold tracking-wide">ShiftSwift</span>
      </div>
      
      <div class="sidebar-menu">
        <a href="dashboard.html" class="sidebar-link">
          <i class="bi bi-grid-1x2-fill"></i>
          <span>Dashboard</span>
        </a>
        <a href="departments.html" class="sidebar-link active">
          <i class="bi bi-building"></i>
          <span>Departments</span>
        </a>
        <a href="shifts.html" class="sidebar-link">
          <i class="bi bi-calendar3"></i>
          <span>Shifts</span>
        </a>
        <a href="attendance.html" class="sidebar-link">
          <i class="bi bi-clock-history"></i>
          <span>Attendance</span>
        </a>
        <a href="leaves.html" class="sidebar-link">
          <i class="bi bi-calendar2-x"></i>
          <span>Leave Requests</span>
        </a>
        <!-- Admin only -->
        <a href="users.html" class="sidebar-link admin-only d-none">
          <i class="bi bi-people-fill"></i>
          <span>User Profiles</span>
        </a>
      </div>

      <div class="sidebar-footer">
        <button id="btn-logout" class="btn btn-outline-danger w-100 d-flex align-items-center justify-content-center gap-2 py-2">
          <i class="bi bi-box-arrow-left"></i>
          <span>Logout</span>
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Top Header Navbar -->
      <header class="top-navbar px-4">
        <div class="d-flex align-items-center gap-2">
          <button class="btn btn-light d-lg-none" type="button" onclick="document.querySelector('.sidebar').classList.toggle('show')">
            <i class="bi bi-list fs-4"></i>
          </button>
          <h4 class="m-0 fw-bold d-none d-sm-block">Departments</h4>
        </div>
        <div class="d-flex align-items-center gap-3">
          <div class="text-end">
            <h6 class="mb-0 fw-semibold" id="nav-username">User</h6>
            <span class="badge bg-primary-subtle text-primary border border-primary-subtle" id="nav-role" style="font-size: 0.75rem;">Role</span>
          </div>
        </div>
      </header>

      <!-- Content Body -->
      <div class="content-body fade-in">
        <!-- Controls Bar -->
        <div class="d-flex flex-column flex-md-row gap-3 align-items-md-center justify-content-between mb-4">
          <div class="input-group" style="max-width: 360px;">
            <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
            <input type="text" class="form-control border-start-0 ps-0" id="dept-search" placeholder="Search departments...">
          </div>
          <button id="btn-add-dept" class="btn premium-btn admin-only">
            <i class="bi bi-plus-lg me-1"></i> Add Department
          </button>
        </div>

        <!-- Data Card -->
        <div class="data-card">
          <div class="table-responsive">
            <table class="table mb-0 align-middle">
              <thead>
                <tr>
                  <th style="width: 80px;">S.No</th>
                  <th>Name</th>
                  <th>Description</th>
                  <th style="width: 120px;" class="admin-only">Actions</th>
                </tr>
              </thead>
              <tbody id="dept-table-body">
                <tr>
                  <td colspan="4" class="text-center py-5 text-muted">
                    <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                    Loading departments...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
          
          <!-- Card Footer for pagination -->
          <div class="data-card-header border-top border-bottom-0 py-3">
            <span class="small text-muted" id="dept-count">Showing 0 of 0 records</span>
            <div id="dept-pagination"></div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Add/Edit Department Modal -->
  <div class="modal fade" id="dept-modal" tabindex="-1" aria-labelledby="dept-modal-title" aria-hidden="true" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title fw-bold" id="dept-modal-title">Add Department</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <form id="dept-form" novalidate>
          <div class="modal-body p-4">
            <div class="mb-3">
              <label for="dept-name" class="form-label small fw-semibold">Department Name</label>
              <input type="text" class="form-control" id="dept-name" placeholder="e.g. Engineering" required>
              <div class="invalid-feedback">Department name is required.</div>
            </div>
            <div class="mb-0">
              <label for="dept-desc" class="form-label small fw-semibold">Description</label>
              <textarea class="form-control" id="dept-desc" rows="3" placeholder="Brief description of the department's function..."></textarea>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-outline-secondary px-4" data-bs-dismiss="modal">Cancel</button>
            <button type="submit" class="btn premium-btn px-4">Save Changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      DepartmentsPage.init();
    });
  </script>
</body>
</html>
