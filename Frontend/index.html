<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShiftSwift - Portal Redirect</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 50%, #e0e7ff 0%, #f8fafc 100%);
    }
  </style>
</head>
<body>
  <div class="text-center">
    <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;">
      <span class="visually-hidden">Loading...</span>
    </div>
    <h4 class="mt-3 fw-bold">Authenticating session...</h4>
    <p class="text-muted">Redirecting you to the workspace portal</p>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Check session
      if (Auth.isAuthenticated()) {
        window.location.replace("dashboard.html");
      } else {
        window.location.replace("login.html");
      }
    });
  </script>
</body>
</html>
